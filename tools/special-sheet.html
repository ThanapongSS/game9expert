<!doctype html>
<html><head><meta charset="utf-8"><title>Special sheet</title>
<style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Dev preview: one frame from each doll's special move, in a grid.
// ?ids=naga,maenak&at=40  (at = frames after the special button press)
import { createMatch, stepMatch } from '../src/sim/match.js';
import { Renderer } from '../src/render/renderer.js';
import { ROSTER } from '../src/characters/index.js';
import { IN, W, H, INTRO_FRAMES } from '../src/config.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || ROSTER.join(',')).split(',');
const at = (q.get('at') || '45').split(',').map(Number);
const cols = 2;
const S = 0.5;
const c = document.getElementById('c');
c.width = W * S * cols;
c.height = H * S * Math.ceil(ids.length / cols);
const ctx = c.getContext('2d');
ids.forEach((id, i) => {
  const m = createMatch({ p1: id, p2: 'teddy', stage: i % 2 ? 'sala' : 'toyroom' });
  const r = new Renderer();
  for (let k = 0; k < INTRO_FRAMES; k++) stepMatch(m, [0, 0]);
  m.f[0].x = 260;
  m.f[1].x = 620;
  m.f[0].energy = 100;
  const n = at[i % at.length];
  for (let k = 0; k < n; k++) {
    const ev = stepMatch(m, [k === 0 ? IN.S : 0, 0]);
    r.events(ev, m);
    r.update(1 / 60, m);
  }
  ctx.save();
  ctx.translate((i % cols) * W * S, Math.floor(i / cols) * H * S);
  ctx.scale(S, S);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  r.draw(ctx, m, { x0: 0, y0: 0, x1: W, y1: H, q: 1 }, {});
  ctx.restore();
});
document.title = 'done';
</script></body></html>
